# Home-lab DuckDB lakehouse. Run from this folder:
#   cp .env.example .env   (then set every CHANGE_ME)
#   docker compose --profile core up -d --build
#   bash scripts/set-dagster-ui-password.sh   (once, before the first up)
# Later phases add services under the governance and monitoring profiles.
name: lakehouse

x-lake-env: &lake-env
  LNL_DATA_DIR: /lake/landing
  LAKE_CATALOG: "ducklake:postgres:dbname=ducklake host=catalog-pg user=lake_rw"
  LAKE_DATA_PATH: /lake/data/
  PGPASSWORD: ${LAKE_RW_PASSWORD:?set LAKE_RW_PASSWORD in .env}
  LAKE_RO_PASSWORD: ${LAKE_RO_PASSWORD:?set LAKE_RO_PASSWORD in .env}   # %load_ext lakehouse.sql_magic reads as lake_ro
  DBT_TARGET: lake
  HF_HOME: /lake/models/huggingface   # session 7's model, staged at a pinned revision by bootstrap.sh
  HF_HUB_OFFLINE: "1"                # notebooks never download from Hugging Face
  PYTHONPATH: /home/jovyan/course     # a notebook in any folder can import lakehouse (and lnl)

x-om-env: &om-env   # OpenMetadata server and its migration step share these settings
  BASE_PATH: /openmetadata             # served at https://<LAKE_TS_HOST>/openmetadata/
  OPENMETADATA_HEAP_OPTS: -Xmx1G -Xms1G
  DB_DRIVER_CLASS: org.postgresql.Driver
  DB_SCHEME: postgresql
  DB_PARAMS: allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
  DB_HOST: catalog-pg
  DB_PORT: "5432"
  DB_USER: openmetadata
  DB_USER_PASSWORD: ${OM_DB_PASSWORD:?set OM_DB_PASSWORD in .env}
  OM_DATABASE: openmetadata_db
  SEARCH_TYPE: opensearch
  ELASTICSEARCH_HOST: opensearch
  ELASTICSEARCH_PORT: "9200"
  ELASTICSEARCH_SCHEME: http
  PIPELINE_SERVICE_CLIENT_ENABLED: "false"   # no Airflow: om_sync.py loads metadata through the API
  FERNET_KEY: ${OM_FERNET_KEY:?set OM_FERNET_KEY in .env}
  # Our own signing keys (bootstrap.sh generates them on the lake disk); the image's built-in keys are public.
  RSA_PUBLIC_KEY_FILE_PATH: /keys/public_key.der
  RSA_PRIVATE_KEY_FILE_PATH: /keys/private_key.der
  JWT_KEY_ID: lakehouse-om
  AUTHENTICATION_PROVIDER: basic
  AUTHENTICATION_ENABLE_SELF_SIGNUP: "false"
  AUTHENTICATION_PUBLIC_KEYS: "[http://localhost:8585/openmetadata/api/v1/system/config/jwks]"
  SERVER_HOST_API_URL: http://openmetadata-server:8585/openmetadata/api

x-dagster: &dagster
  profiles: [core]
  image: lnl-jupyter:local
  restart: unless-stopped
  depends_on:
    catalog-pg:
      condition: service_healthy
  environment:
    <<: *lake-env
    DAGSTER_HOME: /lake/dagster/home
    DAGSTER_PG_PASSWORD: ${DAGSTER_PG_PASSWORD:?set DAGSTER_PG_PASSWORD in .env}
    OM_ADMIN_PASSWORD: ${OM_ADMIN_PASSWORD:?set OM_ADMIN_PASSWORD in .env}   # the daily om_sync.py
    OM_MCP_PASSWORD: ${OM_MCP_PASSWORD:?set OM_MCP_PASSWORD in .env}   # sync_masks.py --check and om_to_rdf.py read as mcp-reader
    FUSEKI_WRITER_PASSWORD: ${FUSEKI_WRITER_PASSWORD:?set FUSEKI_WRITER_PASSWORD in .env}   # om_to_rdf.py replaces the graph
  volumes:
    - ..:/home/jovyan/course
    - /dev/null:/home/jovyan/course/lakehouse/.env:ro   # hide secrets; dbt 1.12 auto-loads any .env above its cwd
    - ${LAKE_ROOT:-/lake}:/lake
  working_dir: /home/jovyan/course

services:
  catalog-pg:
    profiles: [core]
    image: postgres:${POSTGRES_TAG:-17.11-trixie}
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      LAKE_RW_PASSWORD: ${LAKE_RW_PASSWORD}
      LAKE_RO_PASSWORD: ${LAKE_RO_PASSWORD:?set LAKE_RO_PASSWORD in .env}
      DAGSTER_PG_PASSWORD: ${DAGSTER_PG_PASSWORD:?set DAGSTER_PG_PASSWORD in .env}
      SUPERSET_PG_PASSWORD: ${SUPERSET_PG_PASSWORD:?set SUPERSET_PG_PASSWORD in .env}
      OM_DB_PASSWORD: ${OM_DB_PASSWORD:?set OM_DB_PASSWORD in .env}
      LAKE_MONITOR_PASSWORD: ${LAKE_MONITOR_PASSWORD:?set LAKE_MONITOR_PASSWORD in .env}   # 05-monitor.sh
      LAKE_BACKUP_PASSWORD: ${LAKE_BACKUP_PASSWORD:?set LAKE_BACKUP_PASSWORD in .env}   # 06-backup.sh
    volumes:
      - catalog-pg-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"   # host-only, for pg_dump and debugging; never the LAN
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ducklake"]
      interval: 10s
      timeout: 5s
      retries: 10

  jupyter:
    profiles: [core]
    build:
      context: ..
      dockerfile: lakehouse/jupyter/Dockerfile
      args:
        JUPYTER_BASE_TAG: ${JUPYTER_BASE_TAG:-2026-10-12}
    image: lnl-jupyter:local
    restart: unless-stopped
    depends_on:
      catalog-pg:
        condition: service_healthy
    environment:
      <<: *lake-env
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:?set JUPYTER_TOKEN in .env}
      CUBE_SQL_PASSWORD: ${CUBE_SQL_PASSWORD:?set CUBE_SQL_PASSWORD in .env}   # for queries and acceptance tests via Cube
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:?set SUPERSET_ADMIN_PASSWORD in .env}   # for the Superset acceptance test
      MCP_TOKEN: ${MCP_TOKEN:?set MCP_TOKEN in .env}   # for the MCP acceptance test
      OM_ADMIN_PASSWORD: ${OM_ADMIN_PASSWORD:?set OM_ADMIN_PASSWORD in .env}   # setup_admin.py, om_sync.py and their tests
      OM_MCP_PASSWORD: ${OM_MCP_PASSWORD:?set OM_MCP_PASSWORD in .env}   # setup_admin.py creates mcp-reader with it
      FUSEKI_WRITER_PASSWORD: ${FUSEKI_WRITER_PASSWORD:?set FUSEKI_WRITER_PASSWORD in .env}   # loads the glossary into Fuseki; its tests
      GRAFANA_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}   # acceptance/test_monitoring.py
      NTFY_CHECKER_PASSWORD: ${NTFY_CHECKER_PASSWORD:?set NTFY_CHECKER_PASSWORD in .env}   # ntfy's read-only test user: test_ntfy.py, test_alerting.py
      CUBEJS_API_SECRET: ${CUBEJS_API_SECRET:?set CUBEJS_API_SECRET in .env}   # Cube masking tests mint REST tokens (Jupyter already holds lake_rw)
    command: ["start-notebook.py", "--ServerApp.base_url=/jupyter/"]   # served at https://<tailscale name>/jupyter/
    volumes:
      - ..:/home/jovyan/course
      - /dev/null:/home/jovyan/course/lakehouse/.env:ro   # hide secrets; dbt 1.12 auto-loads any .env above its cwd
      - ${LAKE_ROOT:-/lake}:/lake
    expose:
      - "8888"

  load-lake:
    # One-shot loader until the scheduler arrives in a later phase:
    #   docker compose --profile core run --rm load-lake [--regenerate]
    profiles: [core]
    image: lnl-jupyter:local
    depends_on:
      catalog-pg:
        condition: service_healthy
    environment:
      <<: *lake-env
    volumes:
      - ..:/home/jovyan/course
      - /dev/null:/home/jovyan/course/lakehouse/.env:ro   # hide secrets; dbt 1.12 auto-loads any .env above its cwd
      - ${LAKE_ROOT:-/lake}:/lake
    working_dir: /home/jovyan/course
    entrypoint: ["python", "lakehouse/load_lake.py"]
    restart: "no"

  # Scheduler UI and daemon. Same image as Jupyter, so every process pins the same DuckDB.
  # The UI is behind Caddy's basic auth (scripts/set-dagster-ui-password.sh): Dagster has no login of its own.
  dagster-webserver:
    <<: *dagster
    entrypoint: ["bash", "-c", "mkdir -p $$DAGSTER_HOME && cp lakehouse/orchestration/dagster.yaml $$DAGSTER_HOME/ && exec dagster-webserver -h 0.0.0.0 -p 3000 --path-prefix /dagster -f lakehouse/orchestration/definitions.py -d /home/jovyan/course"]
    expose:
      - "3000"
    healthcheck:   # replaces the base image's Jupyter check, which always fails here
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:3000/dagster/server_info"]
      interval: 30s
      timeout: 10s
      start_period: 60s

  dagster-daemon:
    <<: *dagster
    entrypoint: ["bash", "-c", "mkdir -p $$DAGSTER_HOME && cp lakehouse/orchestration/dagster.yaml $$DAGSTER_HOME/ && exec dagster-daemon run -f lakehouse/orchestration/definitions.py -d /home/jovyan/course"]
    healthcheck:   # passes while the daemon's heartbeats in Postgres are fresh
      test: ["CMD", "dagster-daemon", "liveness-check"]
      interval: 60s
      timeout: 30s
      start_period: 90s

  # Semantic layer: the governed query path over gold, with a Postgres-wire SQL API on cube:15432 for Superset
  # and other tools. Reads DuckLake read-only as lake_ro (cube/cube.js). v1.8.3 bundles DuckDB 1.5.5, a read-only
  # exception to "1.5.6 everywhere": no Cube release ships 1.5.6 yet, and the 1.6 line's DuckDB is too old to read
  # the catalog. Checked by acceptance/test_cube.py.
  cube:
    profiles: [core]
    image: cubejs/cube:${CUBE_TAG:-v1.8.3}
    restart: unless-stopped
    depends_on:
      catalog-pg:
        condition: service_healthy
    environment:
      CUBEJS_DB_TYPE: duckdb
      CUBEJS_API_SECRET: ${CUBEJS_API_SECRET:?set CUBEJS_API_SECRET in .env}
      CUBEJS_PG_SQL_PORT: "15432"
      CUBEJS_SQL_USER: lake
      CUBEJS_SQL_PASSWORD: ${CUBE_SQL_PASSWORD:?set CUBE_SQL_PASSWORD in .env}
      CUBEJS_DEV_MODE: "false"
      CUBEJS_CACHE_AND_QUEUE_DRIVER: memory   # no Cube Store until pre-aggregations are needed
      CUBEJS_TELEMETRY: "false"
      PGPASSWORD: ${LAKE_RO_PASSWORD:?set LAKE_RO_PASSWORD in .env}   # read-only role, and only that one
    volumes:
      - ./cube:/cube/conf:ro
      - ${LAKE_ROOT:-/lake}/data:/lake/data:ro
    expose:
      - "4000"
      - "15432"
    healthcheck:   # the image has no curl; Node's fetch asks Cube whether it can answer queries
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/readyz').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 60s

  # Dashboards and SQL Lab at https://<tailscale name>/superset/ (SUPERSET_APP_ROOT; Superset still calls sub-path
  # serving beta). Its only database is Cube, registered by superset/start.sh, so every chart goes through the
  # governed layer. Metadata in catalog-pg's superset database. Checked by acceptance/test_superset.py.
  superset:
    profiles: [core]
    build:
      context: ./superset
      args:
        SUPERSET_TAG: ${SUPERSET_TAG:-6.1.0}
    image: lnl-superset:local
    restart: unless-stopped
    depends_on:
      catalog-pg:
        condition: service_healthy
      cube:
        condition: service_healthy
    environment:
      SUPERSET_APP_ROOT: /superset
      SUPERSET_CONFIG_PATH: /app/lakehouse/superset_config.py
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:?set SUPERSET_SECRET_KEY in .env}
      SUPERSET_PG_PASSWORD: ${SUPERSET_PG_PASSWORD:?set SUPERSET_PG_PASSWORD in .env}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:?set SUPERSET_ADMIN_PASSWORD in .env}
      CUBE_SQL_PASSWORD: ${CUBE_SQL_PASSWORD:?set CUBE_SQL_PASSWORD in .env}
    volumes:
      - ./superset:/app/lakehouse:ro   # the folder, so edits to the config or start script are seen (see caddy)
    command: ["bash", "/app/lakehouse/start.sh"]
    expose:
      - "8088"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8088/superset/health"]
      interval: 30s
      timeout: 10s
      start_period: 120s

  # OpenMetadata's search engine. Private to the Compose network, so the security plugin is off. 1 GB heap.
  opensearch:
    profiles: [core]
    image: opensearchproject/opensearch:${OPENSEARCH_TAG:-2.19.6}
    restart: unless-stopped
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    expose:
      - "9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # OpenMetadata's database migrations; runs to completion before every server start (safe to repeat).
  om-migrate:
    profiles: [core]
    image: docker.getcollate.io/openmetadata/server:${OM_TAG:-2.0.5}
    command: ["./bootstrap/openmetadata-ops.sh", "migrate"]
    environment: *om-env
    volumes:
      - ${LAKE_ROOT:-/lake}/openmetadata/keys:/keys:ro
    depends_on:
      catalog-pg:
        condition: service_healthy
      opensearch:
        condition: service_healthy

  # OpenMetadata 2.0.5: glossary, tables, classifications and lineage (Phase 5). Checked by
  # acceptance/test_openmetadata.py. Its metadata lives in catalog-pg's openmetadata_db.
  openmetadata-server:
    profiles: [core]
    image: docker.getcollate.io/openmetadata/server:${OM_TAG:-2.0.5}
    restart: unless-stopped
    environment: *om-env
    volumes:
      - ${LAKE_ROOT:-/lake}/openmetadata/keys:/keys:ro
    depends_on:
      om-migrate:
        condition: service_completed_successfully
    expose:
      - "8585"
      - "8586"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8586/healthcheck"]   # the image has wget, not curl
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 120s

  # MCP server: query_metric over Cube's REST API, define_term over OpenMetadata's glossary (see mcp/server.py).
  # Holds no lake credentials: its bearer token, Cube's API secret and a read-only OpenMetadata account.
  # Served at https://<LAKE_TS_HOST>/mcp through Caddy. Checked by acceptance/test_mcp.py.
  mcp:
    profiles: [core]
    build:
      context: ./mcp
    image: lnl-mcp:local
    restart: unless-stopped
    depends_on:
      cube:
        condition: service_healthy
    environment:
      MCP_TOKEN: ${MCP_TOKEN:?set MCP_TOKEN in .env}
      CUBEJS_API_SECRET: ${CUBEJS_API_SECRET:?set CUBEJS_API_SECRET in .env}
      LAKE_TS_HOST: ${LAKE_TS_HOST:?run scripts/bootstrap.sh, which sets it from Tailscale}
      OM_MCP_PASSWORD: ${OM_MCP_PASSWORD:?set OM_MCP_PASSWORD in .env}   # read-only mcp-reader: define_term reads OpenMetadata
    volumes:
      - ./mcp:/app:ro              # the folder, not single files, so edits are seen (see caddy)
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 20s

  # Apache Jena Fuseki 6.2.0, built from Apache's release (fuseki/Dockerfile): SPARQL over the glossary and the
  # sensitivity tags. Reads are open to the tailnet; writes need the writer user, whose password is written to a
  # private tmpfs at start. Served at https://<LAKE_TS_HOST>/fuseki/. Checked by acceptance/test_fuseki.py.
  fuseki:
    profiles: [core]
    build:
      context: ./fuseki
    image: lnl-fuseki:local
    restart: unless-stopped
    user: "1000:100"
    environment:
      FUSEKI_WRITER_PASSWORD: ${FUSEKI_WRITER_PASSWORD:?set FUSEKI_WRITER_PASSWORD in .env}
      JAVA_OPTIONS: -Xmx512m
    volumes:
      - ./fuseki:/opt/fuseki/conf:ro   # config.ttl and start.sh: the folder, not single files
      - ${LAKE_ROOT:-/lake}/fuseki:/fuseki/databases
    tmpfs:
      - /run/fuseki:mode=0700,uid=1000,gid=100   # the password file lives here, in memory only
    expose:
      - "3030"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:3030/fuseki/$$/ping"]
      interval: 30s
      timeout: 10s
      start_period: 30s

  # ---- Monitoring (Phase 6): checked by acceptance/test_monitoring.py ----------------------------------------
  # None of these publishes a host port: the tailnet can reach anything bound to the VM's 0.0.0.0, so they stay on
  # the Compose network, and Prometheus is reached only through Caddy at /prometheus/ (behind basic auth).
  prometheus:
    profiles: [core]
    image: prom/prometheus:${PROMETHEUS_TAG:-v3.15.0}
    restart: unless-stopped
    user: "1000:100"
    entrypoint: ["/bin/sh", "/etc/prometheus/start.sh"]   # fills in the probe targets, then runs prometheus
    environment:
      LAKE_TS_HOST: ${LAKE_TS_HOST:?run scripts/bootstrap.sh, which sets it from Tailscale}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.external-url=https://${LAKE_TS_HOST:?run scripts/bootstrap.sh, which sets it from Tailscale}/prometheus/
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro   # the folder, not the file (see caddy)
      - ${LAKE_ROOT:-/lake}/prometheus:/prometheus
    expose:
      - "9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/prometheus/-/ready"]
      interval: 30s
      timeout: 10s
      start_period: 30s

  # The VM: reads the host's /proc, /sys and filesystems through /host. With no host network, its network counters
  # are its own container's; everything else (CPU, memory, load, disks) is the VM's.
  node-exporter:
    profiles: [core]
    image: prom/node-exporter:${NODE_EXPORTER_TAG:-v1.12.1}
    restart: unless-stopped
    pid: host
    command:
      - --path.rootfs=/host
      - --collector.textfile.directory=/host/lake/catalog-backups/metrics   # backup/backup.sh writes these
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+|var/lib/containerd/.+)($$|/)
    volumes:
      - /:/host:ro,rslave
    expose:
      - "9100"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9100/metrics"]
      interval: 30s
      timeout: 10s

  # Every container. cAdvisor needs privileged mode and the Docker socket to see them, which makes it root-equivalent
  # on the VM: the usual way to run it, kept off every network but the Compose one.
  cadvisor:
    profiles: [core]
    image: ghcr.io/google/cadvisor:${CADVISOR_TAG:-v0.60.6}
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.service,com.docker.compose.project
      - --disable_metrics=percpu,process,tcp,udp,referenced_memory,hugetlb,sched,advtcp,resctrl,cpu_topology
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    expose:
      - "8080"

  # Dashboards at https://<LAKE_TS_HOST>/grafana/ (its own login: admin / GRAFANA_ADMIN_PASSWORD). No anonymous
  # access or sign-up, and it never phones home. Data sources come from monitoring/grafana/provisioning.
  grafana:
    profiles: [core]
    image: grafana/grafana:${GRAFANA_TAG:-13.2.3}
    restart: unless-stopped
    user: "1000:100"
    depends_on:
      - prometheus
    environment:
      GF_SERVER_ROOT_URL: https://${LAKE_TS_HOST:?run scripts/bootstrap.sh, which sets it from Tailscale}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}   # set on first start only
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - ${LAKE_ROOT:-/lake}/grafana:/var/lib/grafana
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/grafana/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s

  # catalog-pg's statistics, as lake_monitor (postgres/init/05-monitor.sh): pg_monitor, never table data.
  postgres-exporter:
    profiles: [core]
    image: prometheuscommunity/postgres-exporter:${POSTGRES_EXPORTER_TAG:-v0.20.1}
    restart: unless-stopped
    depends_on:
      catalog-pg:
        condition: service_healthy
    environment:
      DATA_SOURCE_URI: catalog-pg:5432/postgres?sslmode=disable
      DATA_SOURCE_USER: lake_monitor
      DATA_SOURCE_PASS: ${LAKE_MONITOR_PASSWORD:?set LAKE_MONITOR_PASSWORD in .env}
    expose:
      - "9187"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9187/metrics"]
      interval: 30s
      timeout: 10s

  # Probes every site through Caddy on the Tailscale name, certificate checked. Containers can't resolve that name
  # (the VM runs Tailscale with accept-dns off), so it maps to the host, where Caddy's published 443 answers.
  blackbox:
    profiles: [core]
    image: prom/blackbox-exporter:${BLACKBOX_TAG:-v0.29.0}
    restart: unless-stopped
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    volumes:
      - ./monitoring/blackbox:/etc/blackbox:ro
    extra_hosts:
      - "${LAKE_TS_HOST:?run scripts/bootstrap.sh, which sets it from Tailscale}:host-gateway"
    expose:
      - "9115"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9115/-/healthy"]
      interval: 30s
      timeout: 10s

  # Where Dagster pushes job outcomes, load numbers and data-quality pass rates (lakehouse/metrics.py), for
  # Prometheus to scrape. Persisted, so a restart doesn't forget the last numbers.
  pushgateway:
    profiles: [core]
    image: prom/pushgateway:${PUSHGATEWAY_TAG:-v1.11.4}
    restart: unless-stopped
    user: "1000:100"
    command:
      - --persistence.file=/pushgateway/metrics.store
      - --persistence.interval=1m
    volumes:
      - ${LAKE_ROOT:-/lake}/pushgateway:/pushgateway
    expose:
      - "9091"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9091/-/healthy"]
      interval: 30s
      timeout: 10s

  # Nightly catalog backup (backup/backup.sh), 02:00 Central, 14 days kept on /lake/catalog-backups. Same image as
  # catalog-pg, so pg_dump matches the server. Unhealthy when no backup has completed in 26 hours.
  catalog-backup:
    profiles: [core]
    image: postgres:${POSTGRES_TAG:-17.11-trixie}
    restart: unless-stopped
    user: "999:999"   # the image's postgres user, not the notebooks' 1000: the dumps hold every app database
    depends_on:
      catalog-pg:
        condition: service_healthy
    entrypoint: ["bash", "/opt/backup/backup.sh"]
    environment:
      TZ: America/Chicago
      BACKUP_AT: "02:00"
      KEEP_DAYS: "14"
      PGPASSWORD: ${LAKE_BACKUP_PASSWORD:?set LAKE_BACKUP_PASSWORD in .env}   # lake_backup: reads everything, writes nothing
    volumes:
      - ./backup:/opt/backup:ro   # the folder, not the file
      - ${LAKE_ROOT:-/lake}/catalog-backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "find /backups -mindepth 2 -maxdepth 2 -name manifest.json -mmin -1560 | grep -q ."]
      interval: 60s
      timeout: 10s
      start_period: 180s

  # The off-machine backup (backup/offsite.sh): every night at 02:30 Central, after catalog-backup's 02:00 dump, restic
  # copies the catalog dumps and the lake's data together, encrypted, to the backup target (BACKUP_TARGET: a TrueNAS
  # NFS share, a local folder until that exists; bootstrap.sh prepares it). It reads the lake read-only, runs as
  # root so it can read the private dumps and write an NFS share mapped for root, and runs a restore drill monthly.
  # The repository password is RESTIC_PASSWORD in .env: keep a copy off this VM too, or a backup can't be read.
  offsite-backup:
    profiles: [core]
    image: restic/restic:${RESTIC_TAG:-0.19.1}
    restart: unless-stopped
    entrypoint: ["sh", "/opt/offsite/offsite.sh"]
    environment:
      TZ: America/Chicago
      BACKUP_AT: "02:30"
      KEEP_DAILY: "7"
      KEEP_WEEKLY: "4"
      KEEP_MONTHLY: "6"
      DRILL_DAYS: "30"
      RESTIC_REPOSITORY: /target/restic   # here, not only in the script, so `exec offsite-backup restic ...` works too
      RESTIC_PASSWORD_FILE: /run/secrets/restic_password
      RESTIC_CACHE_DIR: /cache/restic
    secrets:
      - restic_password
    volumes:
      - ./backup:/opt/offsite:ro   # the folder, not the file
      - ${LAKE_ROOT:-/lake}/data:/lake/data:ro
      - ${LAKE_ROOT:-/lake}/catalog-backups:/lake/catalog-backups:ro
      - ${LAKE_ROOT:-/lake}/catalog-backups/metrics:/metrics   # node-exporter's textfile collector reads these
      - ${LAKE_ROOT:-/lake}/offsite-cache:/cache   # restic's cache, the drill's scratch space, status.json
      - ${BACKUP_TARGET:-/mnt/lakehouse-backups}:/target
    healthcheck:
      test: ["CMD-SHELL", "find /cache/status.json -mmin -1560 | grep -q ."]
      interval: 60s
      timeout: 10s
      start_period: 900s

  # Alerts from Prometheus's rules (monitoring/prometheus/rules/), at https://<LAKE_TS_HOST>/alertmanager/ behind
  # basic auth. Alertmanager hands each one to ntfy (monitoring/alertmanager/alertmanager.yml), which pushes it to
  # Ian's phone; Watchdog and the selftest's alerts go to topics of their own.
  # Where alerts go: ntfy, only on the tailnet, at https://<LAKE_TS_HOST>:8443/ through Caddy (ntfy can't sit under a
  # path). Deny-all by default; start.sh declares three users from the plain passwords in .env: alertmanager
  # (publishes), ian (the phone app reads) and checker (the tests read). Settings in ntfy/server.yml, the notification
  # format and priority in ntfy/templates/lakehouse.yml. Messages and users live on /lake/ntfy.
  ntfy:
    profiles: [core]
    image: binwiederhier/ntfy:${NTFY_TAG:-v2.30.0}
    restart: unless-stopped
    user: "1000:100"
    entrypoint: ["sh", "/etc/ntfy/start.sh"]
    environment:
      NTFY_BASE_URL: https://${LAKE_TS_HOST:?run scripts/bootstrap.sh, which sets it from Tailscale}:8443
      NTFY_ALERTMANAGER_PASSWORD: ${NTFY_ALERTMANAGER_PASSWORD:?set NTFY_ALERTMANAGER_PASSWORD in .env}
      NTFY_IAN_PASSWORD: ${NTFY_IAN_PASSWORD:?set NTFY_IAN_PASSWORD in .env}
      NTFY_CHECKER_PASSWORD: ${NTFY_CHECKER_PASSWORD:?set NTFY_CHECKER_PASSWORD in .env}
    volumes:
      - ./ntfy:/etc/ntfy:ro   # the folder, not the file
      - ${LAKE_ROOT:-/lake}/ntfy:/var/lib/ntfy
    expose:
      - "8080"   # the app, through Caddy
      - "9095"   # metrics, for Prometheus only
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/v1/health"]
      interval: 30s
      timeout: 10s

  alertmanager:
    profiles: [core]
    image: prom/alertmanager:${ALERTMANAGER_TAG:-v0.34.1}
    restart: unless-stopped
    user: "1000:100"
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.external-url=https://${LAKE_TS_HOST:?run scripts/bootstrap.sh, which sets it from Tailscale}/alertmanager/
      - --cluster.listen-address=   # one instance: no gossip port
    volumes:
      - ./monitoring/alertmanager:/etc/alertmanager:ro   # the folder, not the file
      - ${LAKE_ROOT:-/lake}/alertmanager:/alertmanager
    secrets:
      - ntfy_alertmanager_password   # /run/secrets/ntfy_alertmanager_password, the receivers' password_file
    expose:
      - "9093"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9093/alertmanager/-/healthy"]
      interval: 30s
      timeout: 10s

  caddy:
    profiles: [core]
    image: caddy:${CADDY_TAG:-2.11.7}
    restart: unless-stopped
    environment:
      LAKE_TS_HOST: ${LAKE_TS_HOST:?run scripts/bootstrap.sh, which sets it from Tailscale}
      DAGSTER_UI_USER: ${DAGSTER_UI_USER:?run scripts/set-dagster-ui-password.sh}
      DAGSTER_UI_HASH: ${DAGSTER_UI_HASH:?run scripts/set-dagster-ui-password.sh}
    ports:
      - "443:443"
      - "80:80"
      - "8443:8443"   # ntfy, which can't sit under a path on 443
    volumes:
      - ./caddy:/etc/caddy:ro   # the folder, not the file: a single-file mount keeps the old file after an editor saves a new one
      - caddy-data:/data
      - caddy-config:/config
      - /var/run/tailscale/tailscaled.sock:/var/run/tailscale/tailscaled.sock   # Caddy gets the *.ts.net certificate from Tailscale
    depends_on:
      - jupyter
      - dagster-webserver
      - superset
      - mcp
      - openmetadata-server
      - fuseki
      - prometheus
      - grafana
      - alertmanager
      - ntfy

# Compose writes each of these from .env into a file under /run/secrets, for programs that read a password from a file.
secrets:
  ntfy_alertmanager_password:
    environment: NTFY_ALERTMANAGER_PASSWORD
  restic_password:
    environment: RESTIC_PASSWORD

volumes:
  catalog-pg-data:
  opensearch-data:
  caddy-data:
  caddy-config:
