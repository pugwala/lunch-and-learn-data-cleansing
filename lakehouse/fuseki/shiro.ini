# Shiro settings for Fuseki's UI build, installed by start.sh before Fuseki can write its default (which ships a
# sample user1=passwd1). No users here: dataset writes are checked by Fuseki itself against the writer password
# (config.ttl), and the admin endpoints answer only from inside the container.
[main]
ssl.enabled = false
localhostFilter = org.apache.jena.fuseki.authz.LocalhostFilter

[users]

[roles]

[urls]
/$/server  = anon
/$/ping    = anon
/$/** = localhostFilter
/** = anon
