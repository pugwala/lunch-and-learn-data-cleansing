version: 2

# meta.sensitivity (restricted or personal) is the source of truth for sensitivity: om_sync.py tags these
# columns in OpenMetadata, and Cube masks the restricted ones it serves.

sources:
  - name: silver
    database: lake
    schema: silver
    description: Written by lakehouse/load_lake.py from the course's own session 2-4 cleansing.
    tables:
      - name: hero_offenders
        description: One row per offender record, typed and crosswalked. offender_number is the BIGINT record key.
        columns:
          - name: race
            meta: {sensitivity: restricted}
          - name: religion
            meta: {sensitivity: restricted}
          - name: stg_affiliation
            meta: {sensitivity: restricted}
          - name: race_code
            meta: {sensitivity: restricted}
          - name: race_omb
            meta: {sensitivity: restricted}
          - name: religion_group
            meta: {sensitivity: restricted}
          - name: religion_family
            meta: {sensitivity: restricted}
          - name: stg_group
            meta: {sensitivity: restricted}
          - name: stg_status
            meta: {sensitivity: restricted}
          - name: last_name
            meta: {sensitivity: personal}
          - name: first_name
            meta: {sensitivity: personal}
          - name: alias
            meta: {sensitivity: personal}
          - name: date_of_birth
            meta: {sensitivity: personal}
          - name: conduct_notes
            meta: {sensitivity: personal}
          - name: last_name_std
            meta: {sensitivity: personal}
          - name: first_name_std
            meta: {sensitivity: personal}
          - name: alias_std
            meta: {sensitivity: personal}
      - name: hero_offenders_exceptions
        description: One row per flagged value. Records are flagged, never dropped.
      - name: conduct_notes_answer_key
      - name: trust_test
        description: The course's Trust Test scorecard (lnl.trust), one row per question.

  - name: bronze
    database: lake
    schema: bronze
    tables:
      - name: hero_offenders_raw
        description: Generator output as written, every column VARCHAR.
        columns:
          - name: race
            meta: {sensitivity: restricted}
          - name: religion
            meta: {sensitivity: restricted}
          - name: stg_affiliation
            meta: {sensitivity: restricted}
          - name: last_name
            meta: {sensitivity: personal}
          - name: first_name
            meta: {sensitivity: personal}
          - name: alias
            meta: {sensitivity: personal}
          - name: date_of_birth
            meta: {sensitivity: personal}
          - name: conduct_notes
            meta: {sensitivity: personal}

  - name: ref
    database: lake
    schema: ref
    description: The course crosswalks from lnl/reference/, standing in for owner-maintained reference data.
    tables:
      - name: unit_crosswalk
      - name: nibrs_offenses
      - name: stg_groups
      - name: race_crosswalk
      - name: religion_crosswalk
      - name: violence_codes
      - name: null_tokens
        description: Documented unknown codes per column (lnl.cleaning.NULL_TOKENS), counted as missing.

  - name: ops
    database: lake
    schema: ops
    tables:
      - name: load_runs
        description: One row per load run, written by the loader.
      - name: business_inputs
        description: >
          One row per business input a data product needs (its owning unit, system and days to close a month),
          copied from lakehouse/products/inputs/ by lakehouse/readiness/closes.py sync.
      - name: product_inputs
        description: One row per data product and input it depends on (depends_on:), copied by closes.py sync.
      - name: input_closes
        description: >
          Every close a business unit reported: complete through a month-end, by whom, when (closes.py report).
          Append-only; the latest report per input counts.
