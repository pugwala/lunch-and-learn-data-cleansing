# Gold layer for the home-lab lakehouse. Reads silver and ref (written by lakehouse/load_lake.py),
# writes gold. Run inside the jupyter or dagster containers:
#   dbt build --project-dir lakehouse/dbt --profiles-dir lakehouse/dbt
name: lakehouse_gold
version: "1.0.0"
config-version: 2
profile: lakehouse

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: target
clean-targets: ["target", "logs"]

models:
  lakehouse_gold:
    gold:
      +materialized: table
      +schema: gold
    marts:
      custody:
        +materialized: table
        +schema: mart_custody
      readiness:
        +materialized: view      # live: a business unit's close shows on the next query, with no rebuild
        +schema: mart_readiness

tests:
  lakehouse_gold:
    +severity: error

flags:
  send_anonymous_usage_stats: false
