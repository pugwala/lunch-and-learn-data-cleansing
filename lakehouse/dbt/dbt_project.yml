# Gold layer for the home-lab lakehouse. Reads silver and ref (landed by lakehouse/load_lake.py from course 1's handoff),
# writes gold. Run inside the jupyter or dagster containers:
#   dbt build --project-dir lakehouse/dbt --profiles-dir lakehouse/dbt --exclude tag:world
# The expanded world (models/world, tag:world) has its own bronze, silver and gold, read from the generator's
# messy CSVs under var world_root; Dagster builds it separately, its big facts one month at a time:
#   dbt build --project-dir lakehouse/dbt --profiles-dir lakehouse/dbt --select tag:world
name: lakehouse_gold
version: "1.0.0"
config-version: 2
profile: lakehouse

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
seed-paths: ["seeds"]

vars:
  world_root: /lake/landing/universe/M   # the expanded world's build (lakehouse/universe), messy CSVs and keys
  readiness_start: "1996-01-01"   # the first month period_readiness covers: the expanded world's first fights
target-path: target
clean-targets: ["target", "logs"]

models:
  lakehouse_gold:
    gold:
      +materialized: table
      +schema: gold
    course1:   # course 1's add-on (lakehouse/course1_addon.py): the Trust Test, built only while LAKEHOUSE_COURSE1 is on
      +enabled: "{{ env_var('LAKEHOUSE_COURSE1', 'on') | trim | lower != 'off' }}"
      +materialized: table
      +schema: gold
    marts:
      custody:
        +materialized: table
        +schema: mart_custody
      readiness:
        +materialized: view      # live: a business unit's close shows on the next query, with no rebuild
        +schema: mart_readiness
    world:
      +tags: ["world"]
      bronze:
        +materialized: table
        +schema: world_bronze
      silver:
        +materialized: table
        +schema: world_silver
      gold:
        +materialized: table
        +schema: world_gold

seeds:
  lakehouse_gold:
    +schema: world_silver
    +tags: ["world"]

tests:
  lakehouse_gold:
    +severity: error

flags:
  send_anonymous_usage_stats: false
