# Prometheus for the home-lab lakehouse (Phase 6). Served under /prometheus (--web.external-url in compose.yaml),
# so its own metrics are at /prometheus/metrics. Every target is on the Compose network; none has a host port.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: prometheus
    metrics_path: /prometheus/metrics
    static_configs:
      - targets: ["localhost:9090"]

  # The VM itself: CPU, memory, load and every filesystem (node-exporter reads the host through /host).
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  # Every container, labelled with its Compose service name.
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # Postgres (catalog-pg), as the lake_monitor role: pg_monitor statistics only.
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # Every site through Caddy, as a user on the tailnet sees it (see sites.yml and blackbox/blackbox.yml).
  - job_name: sites
    metrics_path: /probe
    params:
      module: [site]
    file_sd_configs:
      - files: ["/prometheus/sd/sites.yml"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [site]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  # What Dagster pushes (lakehouse/metrics.py): job successes and failures, load numbers, data-quality pass rates.
  # honor_labels keeps each pushed metric's own job and pipeline labels instead of this scrape's.
  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - path_prefix: /alertmanager
      static_configs:
        - targets: ["alertmanager:9093"]
