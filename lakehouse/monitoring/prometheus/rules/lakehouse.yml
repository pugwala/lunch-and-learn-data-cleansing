# Alert rules for the home-lab lakehouse (Phase 6). Thresholds sit well clear of today's values (README, Monitoring),
# so a healthy lakehouse fires only Watchdog. severity: critical means act now; warning means look today.
groups:
  - name: platform
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "Prometheus can't scrape {{ $labels.job }} ({{ $labels.instance }})"
      - alert: SiteDown
        expr: probe_success{job="sites"} == 0
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "/{{ $labels.site }}/ doesn't answer through Caddy"
      - alert: CertificateExpiresSoon
        expr: min by (site) (probe_ssl_earliest_cert_expiry{job="sites"}) - time() < 14 * 86400
        for: 1h
        labels: {severity: warning}
        annotations:
          summary: "The Tailscale certificate expires in under 14 days (Caddy should have renewed it)"
      - alert: DiskFilling
        expr: 1 - node_filesystem_avail_bytes{mountpoint=~"/|/lake"} / node_filesystem_size_bytes{mountpoint=~"/|/lake"} > 0.85
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.mountpoint }} is over 85% full"
      - alert: DiskAlmostFull
        expr: 1 - node_filesystem_avail_bytes{mountpoint=~"/|/lake"} / node_filesystem_size_bytes{mountpoint=~"/|/lake"} > 0.95
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.mountpoint }} is over 95% full"
      - alert: MemoryLow
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "Under 10% of the VM's memory is available"
      - alert: PostgresDown
        expr: pg_up == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "catalog-pg doesn't answer postgres-exporter: the lake's catalog is down"

  - name: pipeline
    rules:
      - alert: JobFailing
        # A job whose last failure is newer than its last success (or that has never succeeded).
        expr: lakehouse_job_last_failure_timestamp_seconds > (lakehouse_job_last_success_timestamp_seconds or lakehouse_job_last_failure_timestamp_seconds * 0)
        labels: {severity: critical}
        annotations:
          summary: "Dagster job {{ $labels.pipeline }}'s latest run failed"
      - alert: DailyLakeStale
        expr: time() - max(lakehouse_job_last_success_timestamp_seconds{pipeline="daily_lake"}) > 26 * 3600 or absent(lakehouse_job_last_success_timestamp_seconds{pipeline="daily_lake"})
        for: 1h
        labels: {severity: critical}
        annotations:
          summary: "daily_lake hasn't succeeded in 26 hours: gold is stale"
      - alert: NotebookSmokeStale
        expr: time() - lakehouse_job_last_success_timestamp_seconds{pipeline="notebook_smoke"} > 8 * 86400
        labels: {severity: warning}
        annotations:
          summary: "The weekly notebook_smoke run hasn't succeeded in 8 days"
      - alert: LakeHousekeepingStale
        # The weekly lake_housekeeping job (housekeeping.py) keeps 30 days of DuckLake history; without it the history,
        # and any personal data that changed, piles up forever. A failed run raises JobFailing on its own.
        expr: time() - lakehouse_job_last_success_timestamp_seconds{pipeline="lake_housekeeping"} > 8 * 86400
        labels: {severity: warning}
        annotations:
          summary: "The weekly lake_housekeeping run hasn't succeeded in 8 days, so old snapshots and files pile up"

  - name: data
    rules:
      - alert: BusinessRuleViolated
        # Something in the catalog breaks a business rule in ontology/shapes.ttl (the daily run checks them all, and
        # Dagster's fuseki/glossary check business_rules_hold names each violation).
        expr: lakehouse_business_rule_violations > 0
        labels: {severity: warning}
        annotations:
          summary: "{{ $value }} thing(s) break the business rule {{ $labels.shape }}; see business_rules_hold in Dagster"
      - alert: SilverDroppedRows
        # Flagged values are flagged, never dropped: silver must hold every bronze row.
        expr: lakehouse_load_rows{layer="silver"} < ignoring(layer) lakehouse_load_rows{layer="bronze"}
        labels: {severity: critical}
        annotations:
          summary: "Silver has fewer rows than bronze: the load dropped records"
      - alert: FlaggedShareHigh
        # About 3% of records carry a flagged value today; a jump means the source or the cleansing changed.
        expr: lakehouse_load_records_with_exceptions / ignoring(layer) lakehouse_load_rows{layer="silver"} > 0.10
        labels: {severity: warning}
        annotations:
          summary: "Over 10% of records have a flagged value (about 3% is normal)"
      - alert: DataQualityBelowFloor
        expr: lakehouse_dq_pass_rate_percent < 95
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.dimension }} pass rate is under the 95% floor"
      - alert: MoreRulesBelowFloor
        # One rule (disciplinary_points completeness, 94.15%) is under the floor by design of the course data.
        expr: lakehouse_dq_rules_below_floor > 1
        labels: {severity: warning}
        annotations:
          summary: "{{ $value }} quality rules are under 95% (1, disciplinary_points, is expected)"

  - name: backup
    rules:
      - alert: CatalogBackupStale
        expr: time() - lakehouse_backup_last_success_timestamp_seconds > 26 * 3600 or absent(lakehouse_backup_last_success_timestamp_seconds)
        for: 30m
        labels: {severity: critical}
        annotations:
          summary: "No catalog backup in 26 hours: lose the catalog and the Parquet files are just files"
      - alert: CatalogBackupFailed
        expr: lakehouse_backup_last_failure_timestamp_seconds > (lakehouse_backup_last_success_timestamp_seconds or lakehouse_backup_last_failure_timestamp_seconds * 0)
        labels: {severity: critical}
        annotations:
          summary: "The latest catalog backup failed (docker compose logs catalog-backup)"

  - name: products
    rules:
      - alert: DataProductStale
        # Each product's age against its own promise (max_age_hours in lakehouse/products/<name>.yml).
        expr: time() - lakehouse_product_refreshed_timestamp_seconds > lakehouse_product_max_age_seconds
        labels: {severity: critical}
        annotations:
          summary: "Data product {{ $labels.product }} is older than it promises"
      - alert: DataProductCoverageLow
        # About 6% of records have no sentence or release date today, so the snapshot can't place them.
        expr: lakehouse_product_records_without_dates / lakehouse_product_records_total > 0.10
        labels: {severity: warning}
        annotations:
          summary: "Over 10% of records can't be placed in time for {{ $labels.product }} (about 6% is normal)"
      - alert: BusinessInputLate
        # A business unit hasn't closed a month by its own deadline (closes_within_days in lakehouse/products/inputs/),
        # so every product that depends on that input stays provisional for the month. A business process is late,
        # not the pipeline: readiness/closes.py status names who and since when.
        expr: lakehouse_input_days_late > 0
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.unit }} is {{ $value }} day(s) late closing the month for {{ $labels.input }}; products that need it stay provisional"

  - name: meta
    rules:
      - alert: AlertDeliveryFailing
        # Alertmanager couldn't hand a notification to ntfy. If ntfy itself is down this can't reach the phone either,
        # but it shows in Alertmanager and Grafana, and TargetDown and SiteDown name ntfy.
        expr: increase(alertmanager_notifications_failed_total[15m]) > 0
        labels: {severity: critical}
        annotations:
          summary: "Alertmanager failed to deliver notifications through {{ $labels.integration }} in the last 15 minutes"
      - alert: Watchdog
        expr: vector(1)
        labels: {severity: none}
        annotations:
          summary: "Always firing, on purpose: it reaches ntfy's lakehouse-heartbeat topic every 4 hours, so silence there means alerting is down"
