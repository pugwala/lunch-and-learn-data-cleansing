# The custody data products. custody_snapshot (hidden) reads mart_custody.custody_snapshot_monthly: one row per
# offender record per month-end it is open. People are counted as distinct SIDs at query time, so a person held
# under two records is one person at any breakdown; the mart never stores people counts, which don't add up.
# Consumers see three views, one per product question. None has a restricted or personal member, so no masking
# applies; admissions reuse offender_records, whose own masks stay as they are.
cubes:
  - name: custody_snapshot
    sql_table: lake.mart_custody.custody_snapshot_monthly
    public: false
    description: Who is in custody at each month-end, one row per open record (mart_custody).

    joins:
      - name: units
        relationship: many_to_one
        sql: "{CUBE}.unit_code = {units}.unit_code"
      - name: offenses
        relationship: many_to_one
        sql: "{CUBE}.offense_code = {offenses}.offense_code"
      - name: population_readiness
        relationship: many_to_one
        sql: "{CUBE}.month_end = {population_readiness}.month_end"
      - name: offenses_readiness
        relationship: many_to_one
        sql: "{CUBE}.month_end = {offenses_readiness}.month_end"

    dimensions:
      - name: snapshot_key
        sql: "CAST({CUBE}.month_end AS VARCHAR) || '-' || CAST({CUBE}.offender_number AS VARCHAR)"
        type: string
        primary_key: true
      - name: month_end
        sql: month_end
        type: time
        description: The month-end the counts are as of.
      - name: is_latest_month_end
        sql: "{CUBE}.month_end = (SELECT max(month_end) FROM lake.mart_custody.custody_snapshot_monthly)"
        type: boolean
        description: The snapshot's last month-end (the last complete month), so a chart can show "now" without a date.
      - name: unit_code
        sql: unit_code
        type: string
      - name: custody_level
        sql: custody_level
        type: string
      - name: threat_level
        sql: threat_level
        type: string
      - name: offense_code
        sql: offense_code
        type: string
      - name: offense_against
        sql: offense_against
        type: string
      - name: violence_code
        sql: violence_code
        type: string

    measures:
      - name: records_in_custody
        type: count
        description: Offender records open at the month-end.
      - name: people_in_custody
        sql: sid_number
        type: count_distinct
        description: Distinct people (SIDs) held at the month-end; records with no SID aren't counted here.
      - name: records_without_sid
        type: count
        filters:
          - sql: "{CUBE}.sid_number IS NULL"
        description: Open records that belong to no known person.

  # Readiness (mart_readiness.period_readiness, a view): is a product's number for a month-end final, or still
  # waiting on a business unit? One cube per product, one row per month-end, joined to the snapshot by month-end,
  # so it rides along without changing any count. A short refresh key, because a unit's close changes it at once.
  - name: all_readiness
    sql_table: lake.mart_readiness.period_readiness
    public: false
    refresh_key: {every: 10 second}
    description: Every data product's months, final or provisional (lakehouse/readiness).
    dimensions: &readiness_dimensions
      - name: period_key
        sql: "{CUBE}.product || '-' || CAST({CUBE}.month_end AS VARCHAR)"
        type: string
        primary_key: true
      - name: product
        sql: product
        type: string
      - name: month_end
        sql: month_end
        type: time
      - name: period_status
        sql: period_status
        type: string
        description: final once every business input the product depends on has closed the month, else provisional.
      - name: waiting_on
        sql: waiting_on
        type: string
        description: The business units whose inputs are still open for the month (empty when final).
      - name: inputs_required
        sql: inputs_required
        type: number
      - name: inputs_closed
        sql: inputs_closed
        type: number
    measures:
      - name: periods
        type: count

  - name: population_readiness
    sql: "SELECT * FROM lake.mart_readiness.period_readiness WHERE product = 'custody-population'"
    public: false
    refresh_key: {every: 10 second}
    dimensions: *readiness_dimensions

  - name: offenses_readiness
    sql: "SELECT * FROM lake.mart_readiness.period_readiness WHERE product = 'custody-offenses'"
    public: false
    refresh_key: {every: 10 second}
    dimensions: *readiness_dimensions

views:
  - name: custody_population
    description: >
      Custody population: who is held at each month-end, by unit, custody level and threat level. Count people
      with people_in_custody (distinct SIDs, never summed); records_in_custody counts open records.
      period_status says whether a month-end's numbers are final yet, waiting_on who they still wait for.
    meta: {product: custody-population}
    cubes:
      - join_path: custody_snapshot
        includes: [month_end, is_latest_month_end, unit_code, custody_level, threat_level, records_in_custody,
                   people_in_custody, records_without_sid]
      - join_path: custody_snapshot.units
        includes: [unit_name]
      - join_path: custody_snapshot.population_readiness
        includes: [period_status, waiting_on]

  - name: custody_offenses
    description: >
      Custody offenses: what the custody population is held for at each month-end, by offense code, category
      and violence code. New sentences per month are in custody_admissions. period_status says whether a
      month-end's numbers are final yet, waiting_on who they still wait for.
    meta: {product: custody-offenses}
    cubes:
      - join_path: custody_snapshot
        includes: [month_end, is_latest_month_end, offense_code, offense_against, violence_code, records_in_custody,
                   people_in_custody]
      - join_path: custody_snapshot.offenses
        includes: [offense_description, crime_against]
      - join_path: custody_snapshot.offenses_readiness
        includes: [period_status, waiting_on]

  - name: custody_admissions
    description: >
      Custody admissions: new sentences by sentence date and offense. admissions counts records sentenced;
      people_admitted counts distinct people (SIDs).
    meta: {product: custody-offenses}
    cubes:
      - join_path: offender_records
        includes:
          - sentence_date
          - offense_code
          - offense_against
          - violence_code
          - name: record_count
            alias: admissions
          - name: people
            alias: people_admitted
      - join_path: offender_records.offenses
        includes: [offense_description]

  - name: period_readiness
    description: >
      Every data product's month-ends, final or provisional: a month is final once every business input the product
      depends on has closed it (lakehouse/products/inputs/, depends_on:), and waiting_on names who is still open.
    cubes:
      - join_path: all_readiness
        includes: [product, month_end, period_status, waiting_on, inputs_required, inputs_closed, periods]
